defaults:
  - train_dinov3_vitb
  - _self_

# DINOv3 ViT-B LoRA + preservation continual pre-training on the Foxconn AOI pool.
#
# This spec carries **arm-D** defaults (LoRA + Gram anchoring + CLS preservation), the
# recommended configuration from docs/plans/dinov3_lora_design.md. The other Stage-4 arms are
# reached from here purely through TRAIN_OVERRIDES in scripts/slurm/dinov3_lora_vitb.sbatch --
# nothing but weights change between arms, so the ablation is clean:
#
#   B  model.gram.enable=false model.gram.w_gram=0.0 model.preservation.enable=false
#   C  model.gram.enable=true  model.gram.w_gram=1.0 model.preservation.enable=false
#   D  (these defaults)
#   E  model.gram.w_gram=2.0 model.preservation.cls_mse_weight=0.10
#      model.preservation.cls_cosine_weight=0.10
#
# Derived from train_dinov3_vitb_foxconn.yaml (nnagrajrao's proven 10-node full-SSL recipe,
# which is our arm-A reference). Everything that affects comparability with that run --
# crop geometry, img_size 512, num_prototypes, precision -- is held identical on purpose.
# What changes is documented inline below.

results_dir: /tmp/dinov3_vitb_lora

model:
  centering_method: sinkhorn
  backbone:
    teacher_type: vit_b
    student_type: vit_b
    img_size: 512
    # OFF for LoRA continual pre-training. This is not the same call as for a from-scratch run:
    # train_dinov3_vitb/_vitl/_highres and nvdinov2 keep 0.4 and should, because the reasoning
    # below needs a preservation anchor and does not transfer to training without one.
    #
    # Measured (TAO-2528, diagnostics D6 + D5) on the arm-C recipe with only this value moved.
    # Seed counts differ per rung; the 0.00 and 0.10 rows are means over 2 and 4 seeds.
    #
    #     drop_path   n   ImageNet retention   gain@224   Wistron@224
    #       0.00      2        -0.60             +1.58       97.05
    #       0.10      4        -4.64             +1.88       96.92
    #       0.20      1        -9.89             +0.52       96.74
    #
    # Run-to-run spread at n = 4 (sd): retention 0.22, gain 0.13, Wistron 0.16, Innodisk 0.31.
    # Retention improves by 4.04 points = 18.4 sd. Both dp = 0 seeds clear the campaign's
    # <=1.0 pt retention rule; no dp > 0 run has ever come within 3.4 of it.
    #
    # The gain difference is a real caveat rather than a footnote: -0.30 balanced, which at n = 2
    # is 1.2 sd and NOT resolved. It sits entirely on Innodisk (305 images, the noisiest readout
    # in the suite); on Wistron the two settings are indistinguishable (+0.13, 0.8 sd). Read this
    # as ~4 points of retention against at most ~0.3 of gain -- a favourable trade, not free.
    #
    # Why, mechanically: stochastic depth makes the student a different random sub-network on
    # every step while the Gram and CLS terms anchor a *full-depth* frozen teacher. The optimizer
    # therefore pulls an ensemble average toward the anchor and leaves the full-depth network --
    # the one inference loads -- unconstrained. This is also why it went unnoticed for two
    # campaigns: the post-train drift probe runs in eval mode, where stochastic depth is off, so
    # it cannot see the channel at all.
    #
    # Superseded reasoning, kept because it is still true and still why 0.4 was wrong: stochastic
    # depth is capacity control sized for full fine-tuning of 86M parameters, where under LoRA
    # only ~0.44M adapter params are trainable with the base frozen; and at dp 0.4 in train mode
    # cls_cos reads 9.3e-01 where the model is provably an identity (1.2e-07 at dp 0.0, eval).
    drop_path_rate: 0.0

  # --- arm-D: LoRA on ---------------------------------------------------------------------
  lora:
    enable: true
    rank: 8
    alpha: 16.0            # scale = alpha/rank = 2.0
    dropout: 0.05
    target_modules: [qkv, proj]
    num_last_blocks: 0     # 0 = all 12 blocks; ~0.44M trainable adapter params for ViT-B

  # --- arm-D: patch-geometry anchor -------------------------------------------------------
  gram:
    enable: true
    w_gram: 1.0
    start_step: 0          # anchor from step 0: in continual pre-training there is no "early
                           # training" phase to protect, and LoRA is an identity at init anyway
    teacher_source: pretrained   # 'ema' is a full-FT concept and is guardrail-rejected with LoRA

  # --- arm-D: global-geometry anchor ------------------------------------------------------
  preservation:
    enable: true
    cls_mse_weight: 0.05
    cls_cosine_weight: 0.05

dataset:
  train_dataset:
    # Flat directory of 597,617 AOI images. The '_wds' suffix is historical -- it is NOT
    # webdataset shards; DinoV2Dataset rglobs image files and rejects archives.
    images_dir: /lustre/fsw/portfolios/edgeai/users/nnagrajrao/datasets/Foxconn_wds
  batch_size: 16
  workers: 8
  transform:
    n_global_crops: 2
    global_crops_scale: [0.32, 1.0]
    global_crops_size: 512
    n_local_crops: 4
    local_crops_scale: [0.05, 0.32]
    local_crops_size: 112

train:
  pretrained_model_path: /lustre/fsw/portfolios/edgeai/projects/edgeai_tao-ptm_image-foundation-model-clip/hf_cache/hub/models--timm--vit_base_patch16_dinov3.lvd1689m/snapshots/c6a5fb7d12bbd3cf3b0079253141c3332aaed7da

  # 1 node, not 10. LoRA arms are ~10-20k steps rather than 12 epochs, and the plan mandates
  # sequential single-node submission for fairshare etiquette and clean attribution.
  num_nodes: 1
  num_gpus: 8

  # Step budget. Global batch = num_nodes * num_gpus * batch_size = 1 * 8 * 16 = 128 images.
  # Foxconn pool = 597,617 images -> 597617/128 ~= 4,669 optimizer steps per epoch.
  # 3 epochs ~= 14,000 steps, which sits mid-range in the plan's 10-20k per-arm window.
  # (2 epochs ~= 9.3k would undershoot it; 4 ~= 18.7k is the upper end if an arm needs longer.)
  num_epochs: 3

  # Step-unit checkpointing, NOT epoch-unit. An epoch here is ~4,669 steps and the cluster caps
  # GPU jobs at 4h, so epoch-unit checkpointing cannot produce a checkpoint at all -- the epoch
  # boundary is never reached inside one allocation.
  #
  # The interval is set by the recomputation cost of a requeue, measured on the first Stage-4
  # boundary. A 3.65h window covers ~1,900 steps, and the kill lands uniformly within the
  # checkpoint interval, so expected loss is interval/2 per boundary:
  #
  #   interval 1000 -> ~500 steps lost = 26.3% recompute + 0.4% write = 26.7% overhead
  #   interval  500 -> ~250 steps lost = 13.2% recompute + 0.8% write = 14.0% overhead
  #   interval  250 -> ~125 steps lost =  6.6% recompute + 1.7% write =  8.3% overhead
  #
  # Observed at 1000: arms C/D/E each recomputed ~870 steps (47% of the window) because the
  # kill landed just before their next checkpoint. 250 trades ~1.7% write time for ~18% less
  # recomputation and is the better default.
  #
  # Disk: 14,004/250 = 56 checkpoints x 1.29 GB = ~72 GB per arm. Fine against a 250 TB quota,
  # but note TAO_SSL_CHECKPOINT_KEEP_LAST_N has no reader anywhere in the codebase (it is a
  # no-op), so nothing prunes these -- tightening the interval further scales disk linearly.
  checkpoint_interval: 250
  checkpoint_interval_unit: step

  layerwise_decay: 1.0
  clip_grad_norm: 3.0
  precision: 16-mixed
  num_prototypes: 4096     # matches the arm-A foxconn run; the 131072 base default is sized
                           # for LVD-scale pre-training, not a 597k domain pool

  schedulers:
    learning_rate:
      # LR 3.2e-4 -> 3.2e-5. Linear rescaling of the proven 10-node foxconn recipe to 1 node,
      # as mandated by the slurm plan:
      #
      #   foxconn : 10 nodes x 8 GPUs x 16 = 1280 global batch  @ 3.2e-4
      #   here    :  1 node  x 8 GPUs x 16 =  128 global batch  @ 3.2e-4 * (128/1280) = 3.2e-5
      #
      # Stated explicitly because the choice is not neutral: the base spec
      # (train_dinov3_vitb.yaml) uses sqrt scaling, which would instead give
      # 3.2e-4 * sqrt(128/1280) = 1.01e-4. Linear is the conservative option and is what the
      # plan specifies, so it is what all four arms use -- the arms are compared against each
      # other, so a shared LR is what matters for the ablation. Worth revisiting if arm B shows
      # no in-domain gain at 14k steps: LoRA commonly wants a *higher* LR than full FT because
      # only the adapters move, so an undershoot would surface as the plan's kill criterion
      # ("arm D shows no in-domain gain") for a reason that is optimization, not preservation.
      val_base: 3.2e-5
      val_final: 1e-6
      # ~7% of the 14k-step budget, matching the foxconn warm-up fraction (400/5601).
      warm_up_steps: 1000
    last_layer_learning_rate:
      val_base: 3.2e-5
      val_final: 1e-6
      warm_up_steps: 1000
      # The DINO head is randomly initialized (Meta ships inference backbones only), and under
      # LoRA it is one of the few fully-trainable modules -- so it can race ahead of a frozen,
      # rank-bounded backbone (design-doc risk R5). Keep the foxconn value of 0: the recipe ran
      # without a prototype freeze and this spec should not silently diverge from arm A. If the
      # smoke run shows the DINO loss destabilizing early, this is the first knob to turn.
      freeze_steps: 0
    momentum:
      val_base: 0.999      # foxconn value, kept for arm-A comparability
    teacher_temperature:
      # foxconn used 100 warm-up steps over a ~5.6k-step run (1.8%); same fraction of our
      # 14k-step budget is ~250.
      warm_up_steps: 250
